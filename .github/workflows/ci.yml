name: BARQ DevOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      PUBLIC_PORT: 8080
      POSTGRES_PASSWORD: ci-test-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax checks
        run: |
          python -m py_compile app/server.py
          python -m py_compile validate.py
          python -m py_compile failure_test.py

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build application image
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for services
        run: |
          timeout 120 bash -c '
            until
              docker inspect -f "{{.State.Health.Status}}" postgres | grep -qx healthy &&
              docker inspect -f "{{.State.Health.Status}}" redis | grep -qx healthy &&
              docker inspect -f "{{.State.Health.Status}}" app-01 | grep -qx healthy &&
              docker inspect -f "{{.State.Health.Status}}" app-02 | grep -qx healthy
            do
              docker compose ps
              sleep 3
            done
          '
        #Mat3mlsh Test ela lma kol el Containers el mawgooda teb2a gahza — PostgreSQL + Redis + app-01 + app-02 kolhom yeb2o Healthy

      - name: Show service status
        run: docker compose ps

      - name: Run environment validation
        run: ./validate.py

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v
